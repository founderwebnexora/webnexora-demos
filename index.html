<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webnexora — Website Demos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#FBF6EE; --surface:#FFFFFF; --line:#EDE1CC;
    --text-primary:#2B2117; --text-secondary:#6E5F4C; --text-muted:#9C8C74;
    --brand:#2F6FED; --brand-hover:#2557C4; --brand-bg:#E7EFFD;
    --radius:14px;
    --shadow-card:0 1px 2px rgba(60,43,17,0.06), 0 6px 20px rgba(60,43,17,0.05);
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-body);background:var(--canvas);color:var(--text-primary);-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}

  header{padding:48px 24px 36px;text-align:center;background:radial-gradient(circle at 50% 0%, #FFF3DE 0%, transparent 60%), var(--canvas);}
  .brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:22px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#5B8DEF);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:13px;color:#fff;}
  .brand .word{font-family:var(--font-display);font-weight:600;font-size:18px;}
  h1{font-family:var(--font-display);font-size:clamp(28px,4vw,40px);font-weight:600;margin:0 0 12px;line-height:1.2;}
  header p{font-size:15px;color:var(--text-secondary);max-width:520px;margin:0 auto;line-height:1.6;}

  .wrap{max-width:920px;margin:0 auto;padding:0 24px 70px;}

  .list{display:flex;flex-direction:column;gap:14px;}
  .row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:22px;
    padding:24px 26px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow-card);transition:background .12s,transform .12s,box-shadow .12s;}
  .row:hover{background:#FFFBF3;transform:translateY(-2px);box-shadow:0 2px 4px rgba(60,43,17,.06),0 10px 24px rgba(60,43,17,.08);}

  .row-main .type{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px;}
  .row-main .name{font-family:var(--font-display);font-size:17px;font-weight:600;line-height:1.2;margin-bottom:6px;}
  .row-main .tagline{font-size:13.5px;color:var(--text-secondary);line-height:1.55;max-width:460px;}

  .tier-chip{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
    background:var(--canvas);color:var(--text-secondary);border:1px solid var(--line);padding:5px 11px;border-radius:100px;white-space:nowrap;}

  .price{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;text-align:right;}
  .price small{display:block;font-family:var(--font-body);font-weight:400;color:var(--text-muted);font-size:11px;margin-top:2px;}

  .row a.cta{display:inline-block;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;
    background:var(--brand-bg,#E7EFFD);color:var(--brand);border:1px solid transparent;white-space:nowrap;transition:all .12s;}
  .row a.cta:hover{background:var(--brand);color:#fff;}

  @media (max-width:720px){
    .row{grid-template-columns:1fr;gap:12px;}
    .price{text-align:left;}
  }

  footer{text-align:center;padding:30px 24px 50px;font-size:12px;color:var(--text-muted);}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="mark">WX</div><div class="word">webnexora</div></div>
  <h1>Website designs, ready to launch.</h1>
  <p>Ten fully built, live business websites — each with real booking or contact forms wired in. Pick one, show it, sell it.</p>
</header>

<div class="wrap">
  <div class="list" id="list"></div>
</div>

<footer>Internal catalogue for the Webnexora sales team · pricing shown is a starting range, not final quote.</footer>

<script>
const SITES = [
  { url:'car-rental-001.html',    type:'Car Rental',                name:'Al Noor Car Rentals',
    tagline:'A fleet-forward booking site that makes renting feel like arriving.', tier:'Tier 2', min:10000, max:12000 },
  { url:'cctv-security-001.html', type:'Surveillance & Security',   name:'Ayoub Securities',
    tagline:'Confidence-first security branding with clear package tiers.', tier:'Tier 1', min:12000, max:18000 },
  { url:'ortho-care-001.html',    type:'Orthopedic Clinic',         name:'Meridian Orthopedics',
    tagline:'A calm, clinical site built to turn visits into booked consultations.', tier:'Tier 2', min:10000, max:12000 },
  { url:'cardio-care.html',       type:'Cardiology Clinic',         name:'Sanjeev Cardiologist',
    tagline:'A solo-practice site that reads like a trusted specialist, not a template.', tier:'Tier 2', min:10000, max:12000 },
  { url:'cctv-security-002.html', type:'Surveillance & Security',   name:'Zystem Security',
    tagline:'A lean, modern intake site for security consultations.', tier:'Tier 3', min:8000, max:10000 },
  { url:'multi-cusine-001/',      type:'Fine Dining Restaurant',    name:'The Grand Epicure',
    tagline:'Cinematic fine-dining presentation with a real seat-reservation flow.', tier:'Tier 2', min:10000, max:12000 },
  { url:'qsr-001/',               type:'Quick-Service Restaurant',  name:'Burger Blaze',
    tagline:'Bold, energetic QSR branding built to move orders, not just look good.', tier:'Tier 1', min:15000, max:18000 },
  { url:'cafe-small-001.html',    type:'Café',                      name:'Crust and Brew',
    tagline:'A warm neighbourhood-café feel with menu, gallery and easy contact.', tier:'Tier 2', min:10000, max:12000 },
  { url:'real-estate-001.html',   type:'Real Estate',               name:'Apex Prime Realty',
    tagline:'Luxury-listings presentation built for high-value lead capture.', tier:'Tier 1', min:12000, max:15000 },
  { url:'car-detailing-001.html', type:'Auto Detailing',            name:'Prisma Atelier',
    tagline:'A before/after-driven booking site for premium detailing packages.', tier:'Tier 1', min:15000, max:18000 },
];

function money(n){ return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n); }

document.getElementById('list').innerHTML = SITES.map(s => `
  <div class="row">
    <div class="row-main">
      <div class="type">${s.type}</div>
      <div class="name">${s.name}</div>
      <p class="tagline">${s.tagline}</p>
    </div>
    <span class="tier-chip">${s.tier}</span>
    <div class="price">${money(s.min)} – ${money(s.max)}<small>starting</small></div>
    <a class="cta" href="${s.url}" target="_blank" rel="noopener">View demo →</a>
  </div>
`).join('');
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Menu — The Grand Epicure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --obsidian: #0a0a0b;
    --obsidian-2: #121214;
    --onyx: #1a1a1d;
    --emerald-deep: #0d3b2e;
    --emerald: #145c47;
    --emerald-soft: #1f7a5f;
    --gold: #c9a961;
    --gold-bright: #e0c27a;
    --brass: #b8924a;
    --cream: #f3ecd9;
    --cream-soft: #e8dfc5;
    --muted: #8a8478;
    --line: rgba(201,169,97,0.18);
    --serif: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
    --sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--obsidian);color:var(--cream);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body{line-height:1.7;letter-spacing:.01em;font-size:16px}
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::selection{background:var(--gold);color:var(--obsidian)}
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:var(--obsidian)}
  ::-webkit-scrollbar-thumb{background:var(--emerald-deep);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--gold)}

  h1,h2,h3,h4{font-family:var(--serif);font-weight:400;letter-spacing:.01em;line-height:1.1}
  .eyebrow{font-family:var(--sans);font-size:.72rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);font-weight:500}
  .display{font-family:var(--serif);font-weight:300;font-size:clamp(2.4rem,6vw,5rem);line-height:1.05}
  .display em{font-style:italic;color:var(--gold-bright);font-weight:400}

  .container{width:min(1200px,90%);margin-inline:auto}
  section{padding:clamp(4rem,8vw,7rem) 0;position:relative}

  /* ---------- Navigation ---------- */
  .nav{position:fixed;top:0;left:0;right:0;z-index:90;padding:1.2rem 0;transition:all .4s var(--ease);backdrop-filter:blur(0)}
  .nav.scrolled{background:rgba(10,10,11,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .nav__inner{display:flex;align-items:center;justify-content:space-between}
  .logo{font-family:var(--serif);font-size:1.5rem;letter-spacing:.18em;color:var(--cream);font-weight:400}
  .logo span{color:var(--gold)}
  .nav__links{display:flex;gap:2.2rem;list-style:none;align-items:center}
  .nav__links a{font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;color:var(--cream-soft);position:relative;padding:.3rem 0;transition:color .3s;white-space:nowrap}
  .nav__links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--gold);transition:width .4s var(--ease)}
  .nav__links a:hover{color:var(--gold)}
  .nav__links a:hover::after{width:100%}
  .nav__cta{display:inline-flex;align-items:center;padding:.7rem 1.4rem;border:1px solid var(--gold);color:var(--gold);font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;transition:all .3s var(--ease);background:transparent}
  .nav__cta:hover{background:var(--gold);color:var(--obsidian)}
  .nav__burger{display:none;flex-direction:column;gap:6px;padding:.6rem;z-index:101;background:none}
  .nav__burger span{width:26px;height:1.5px;background:var(--cream);transition:.3s;display:block}
@media(max-width:900px){.nav__links,.nav__cta{display:none}.nav__burger{display:flex}}

  .mobile-menu{position:fixed;inset:0;z-index:102;background:rgba(10,10,11,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5rem;opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
  .mobile-menu.open{opacity:1;pointer-events:all}
  .mobile-menu a{display:block; font-family:var(--serif);font-size:clamp(1.8rem,5vw,2.8rem);color:var(--cream);opacity:0;transform:translateY(20px);transition:all .5s var(--ease);position:relative}
  .mobile-menu.open a{opacity:1;transform:translateY(0)}
  .mobile-menu a::after{content:"";position:absolute;left:50%;bottom:-4px;width:0;height:1px;background:var(--gold);transition:all .4s var(--ease);transform:translateX(-50%)}
  .mobile-menu a:hover::after{width:100%}
  .mobile-menu a:hover{color:var(--gold-bright)}
  .mobile-menu__close{position:absolute;top:1.4rem;right:1.4rem;width:44px;height:44px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--cream);font-size:1.4rem;transition:all .3s}
  .mobile-menu__close:hover{border-color:var(--gold);color:var(--gold);transform:rotate(90deg)}

  /* ---------- Page Header ---------- */
  .page-header{min-height:50vh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;padding:8rem 1.5rem 4rem}
  .page-header::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(20,92,71,.2), transparent 60%),linear-gradient(180deg, rgba(10,10,11,.5), var(--obsidian));z-index:1}
  .page-header::after{content:"";position:absolute;inset:0;background-image:url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1920&q=80');background-size:cover;background-position:center;opacity:.25;z-index:0;filter:contrast(1.05) saturate(.8)}
  .page-header__content{position:relative;z-index:2}
  .page-header__tag{display:inline-flex;align-items:center;gap:.8rem;margin-bottom:1.5rem}
  .page-header__tag::before,.page-header__tag::after{content:"";width:40px;height:1px;background:var(--gold);opacity:.6}

  /* ---------- Menu Sections ---------- */
  .menu-cat{margin-bottom:clamp(4rem,8vw,6rem)}
  .menu-cat:last-child{margin-bottom:0}
  .menu-cat__head{display:flex;align-items:baseline;gap:1.5rem;margin-bottom:2.5rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}
  .menu-cat__head h3{font-family:var(--serif);font-size:clamp(1.6rem,3vw,2.2rem);color:var(--cream)}
  .menu-cat__head span{font-family:var(--sans);font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}

  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem 4rem}
  .menu-item{display:grid;grid-template-columns:1fr auto;gap:.3rem 1.2rem;padding-bottom:1.4rem;border-bottom:1px dashed var(--line);transition:transform .3s var(--ease)}
  .menu-item:hover{transform:translateX(6px)}
  .menu-item h4{font-family:var(--serif);font-size:1.35rem;font-weight:500;color:var(--cream)}
  .menu-item .price{font-family:var(--serif);color:var(--gold);font-size:1.15rem;font-style:italic;align-self:start}
  .menu-item p{grid-column:1/-1;color:var(--muted);font-size:.92rem;margin-top:.2rem;line-height:1.6}
  .menu-item .tags{grid-column:1/-1;margin-top:.5rem;display:inline-flex;gap:.4rem;flex-wrap:wrap}
  .menu-item .tags span{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;padding:.25rem .6rem;border:1px solid var(--emerald);color:var(--emerald-soft);border-radius:2px}
  .menu-item .tags span.sig{border-color:var(--gold);color:var(--gold)}

  @media(max-width:800px){
    .menu-grid{grid-template-columns:1fr;gap:2rem}
  }

  /* ---------- Buttons ---------- */
  .btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:1rem 2.2rem;font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;font-weight:500;overflow:hidden;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
  .btn--primary{background:var(--gold);color:var(--obsidian);border:1px solid var(--gold)}
  .btn--primary:hover{box-shadow:0 10px 40px rgba(201,169,97,.25)}
  .btn--ghost{border:1px solid var(--line);color:var(--cream)}
  .btn--ghost:hover{border-color:var(--gold);color:var(--gold)}

  /* ---------- Footer ---------- */
  footer{background:var(--obsidian-2);border-top:1px solid var(--line);padding:4rem 0 2rem;margin-top:4rem}
  .footer__grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:3rem;margin-bottom:3rem}
  .footer__col h5{font-family:var(--sans);font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:1.2rem;font-weight:500}
  .footer__col p,.footer__col a{color:var(--cream-soft);font-size:.92rem;display:block;margin-bottom:.5rem;transition:color .3s}
  .footer__col a:hover{color:var(--gold)}
  .footer__brand p{margin-top:1rem;max-width:34ch;font-size:.92rem;line-height:1.7}
  .footer__bottom{padding-top:2rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);flex-wrap:wrap;gap:1rem}
  .footer__bottom .halal{color:var(--emerald-soft)}
  @media(max-width:760px){.footer__grid{grid-template-columns:1fr 1fr;gap:2rem}}
  @media(max-width:500px){.footer__grid{grid-template-columns:1fr}}

  /* ---------- Scroll Reveal ---------- */
  .reveal-fade{opacity:0;transform:translateY(30px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
  .reveal-fade.in{opacity:1;transform:translateY(0)}

  .ornament{display:flex;align-items:center;justify-content:center;gap:1rem;margin:1rem 0}
  .ornament::before,.ornament::after{content:"";width:40px;height:1px;background:var(--gold);opacity:.5}
  .ornament span{color:var(--gold);font-family:var(--serif);font-size:1.2rem}
</style>
<base target="_blank">
</head>
<body>

<!-- ============ NAVIGATION ============ -->
<header class="nav" id="nav">
  <div class="container nav__inner">
    <a href="index.html" class="logo">THE GRAND <span>EPICURE</span></a>
    <nav>
      <ul class="nav__links" id="navLinks"></ul>
    </nav>
    <a href="index.html#contact" class="nav__cta" id="navCta"></a>
    <button class="nav__burger" id="burger" aria-label="Open Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="mobile-menu" id="mobileMenu">
  <button class="mobile-menu__close" id="mobileClose" aria-label="Close Menu">✕</button>
  <div id="mobileLinks"></div>
</div>

<!-- ============ PAGE HEADER ============ -->
<section class="page-header">
  <div class="page-header__content">
    <div class="page-header__tag eyebrow reveal-fade" id="headerTag"></div>
    <h1 class="display reveal-fade" id="headerTitle"></h1>
    <p style="max-width:55ch;margin:1.2rem auto 0;color:var(--cream-soft);font-size:1.05rem;" class="reveal-fade" id="headerDesc"></p>
    <div class="ornament reveal-fade"><span>✦</span></div>
  </div>
</section>

<!-- ============ MENU ============ -->
<section>
  <div class="container" id="menuContainer"></div>
</section>

<!-- ============ FOOTER ============ -->
<footer>
  <div class="container">
    <div class="footer__grid" id="footerGrid"></div>
    <div class="footer__bottom" id="footerBottom"></div>
  </div>
</footer>

<script>
const d = window.MENU_DATA;

/* Nav */
document.getElementById('navLinks').innerHTML = d.nav.links.map(l =>
  `<li><a href="${l.href}">${l.label}</a></li>`
).join('');
document.getElementById('navCta').textContent = d.nav.cta;
document.getElementById('mobileLinks').innerHTML = d.nav.links.map((l,i) =>
  `<a href="${l.href}" style="transition-delay:${i*60}ms">${l.label}</a>`
).join('');

/* Header */
document.getElementById('headerTag').textContent = d.header.tag;
document.getElementById('headerTitle').innerHTML = d.header.title[0] + '<br><em>' + d.header.title[1] + '</em>';
document.getElementById('headerDesc').textContent = d.header.description;

/* Menu Categories */
document.getElementById('menuContainer').innerHTML = d.categories.map(cat => `
  <div class="menu-cat reveal-fade">
    <div class="menu-cat__head">
      <h3>${cat.name}</h3>
      <span>${cat.subtitle}</span>
    </div>
    <div class="menu-grid">
      ${cat.items.map(item => `
        <div class="menu-item">
          <h4>${item.name}</h4>
          <span class="price">$${item.price}</span>
          <p>${item.description}</p>
          <div class="tags">${item.tags.map(t => `<span class="${t.sig?'sig':''}">${t.text}</span>`).join('')}</div>
        </div>
      `).join('')}
    </div>
  </div>
`).join('');

/* Footer */
document.getElementById('footerGrid').innerHTML = `
  <div class="footer__col footer__brand">
    <div class="logo">THE GRAND <span>EPICURE</span></div>
    <p>${d.footer.brand}</p>
  </div>
  <div class="footer__col">
    <h5>Visit</h5>
    ${d.footer.address.map(l => `<p>${l}</p>`).join('')}
  </div>
  <div class="footer__col">
    <h5>Hours</h5>
    ${d.footer.hours.map(l => `<p>${l}</p>`).join('')}
  </div>
  <div class="footer__col">
    <h5>Connect</h5>
    ${d.footer.links.map(l => `<a href="${l.href}">${l.label}</a>`).join('')}
  </div>
`;
document.getElementById('footerBottom').innerHTML = `
  <div>${d.footer.copyright}</div>
  <div class="halal">${d.footer.halal}</div>
`;

/* Interactions */
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 40));

const burger = document.getElementById('burger');
const mobileMenu = document.getElementById('mobileMenu');
const mobileClose = document.getElementById('mobileClose');
function openMobile(){ mobileMenu.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeMobile(){ mobileMenu.classList.remove('open'); document.body.style.overflow = ''; }
burger.addEventListener('click', openMobile);
mobileClose.addEventListener('click', closeMobile);
document.querySelectorAll('#mobileLinks a').forEach(a => a.addEventListener('click', closeMobile));

const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold: 0.12, rootMargin: '0px 0px -50px 0px' });
document.querySelectorAll('.reveal-fade').forEach(el => io.observe(el));
</script>
</body>
</html>
